[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-burnback"
version = "0.1.0"
description = "3D solid rocket motor grain burnback simulation using the Level Set Method"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "pyvista>=0.42",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# The desktop application (#157). Kept optional so the engine stays importable
# on headless machines and in CI without pulling in Qt.
desktop = [
    "PySide6>=6.6",
    "pyvistaqt>=0.11",
    "trimesh>=4.0",
]

[project.scripts]
srm-burnback-studio = "desktop:main"

[tool.setuptools.packages.find]
include = ["srm_burnback*", "desktop*"]
